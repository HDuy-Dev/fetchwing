<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fetchwing — allow access</title>
<style>
  body { margin: 0; font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 20px; color: #1f2328; background: #fff; }
  @media (prefers-color-scheme: dark) { body { color: #e3e5e8; background: #1f2023; } }
  h1 { font-size: 16px; margin: 0 0 8px; }
  code { word-break: break-all; }
  button { font: inherit; padding: 6px 14px; border-radius: 4px; border: 1px solid #5b3fd4; background: #5b3fd4; color: #fff; cursor: pointer; }
  #result { margin-top: 10px; }
</style>
</head>
<body>
  <h1>Allow Fetchwing to access this site?</h1>
  <p>Fetchwing needs access to <code id="origin"></code> to send requests to it or mock its responses.</p>
  <button id="allow" type="button">Allow access</button>
  <p id="result" role="status"></p>
  <script type="module" src="grant.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fetchwing — allow access</title>
<style>
  body { margin: 0; font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 20px; color: #172033; background: #f5f7fb; }
  [data-mode="dark"] body { color: #e6ebf2; background: #0f1520; }
  h1 { font-size: 16px; margin: 0 0 8px; }
  code { word-break: break-all; }
  button { font: inherit; padding: 6px 14px; border-radius: 4px; border: 0; background: #0f766e; color: #fff; font-weight: 700; cursor: pointer; }
  [data-mode="dark"] button { background: #2dd4bf; color: #042f2e; }
  #result { margin-top: 10px; }
</style>
</head>
<body>
  <h1>Allow Fetchwing to access this site?</h1>
  <p>Fetchwing needs access to <code id="origin"></code> to send requests to it or mock its responses.</p>
  <button id="allow" type="button">Allow access</button>
  <p id="result" role="status"></p>
  <script type="module" src="grant.js"></script>
</body>
</html>

<!doctype html>
<html lang="en" data-mode="dark">
<head>
<meta charset="utf-8">
<title>Fetchwing</title>
<link rel="stylesheet" href="panel.css">
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="logo"><span class="mark" id="logoMark" aria-hidden="true"></span><span class="word">Fetchwing</span></div>
    <div class="search" id="searchBox" role="button" tabindex="0" aria-label="Search requests" title="Search (⌘K)"></div>
    <button class="btn mock-chip" id="mockChip" type="button" aria-haspopup="menu" hidden></button>
    <label class="env-pill" id="envPill" title="Environment"><span id="envIcon" aria-hidden="true"></span><select id="envSelect" aria-label="Environment"></select></label>
    <button class="icon-btn" id="themeBtn" type="button"></button>
    <button class="icon-btn" id="settingsBtn" type="button" aria-label="Settings" title="Settings"></button>
  </header>

  <div class="body">
    <nav class="rail" aria-label="Sections">
      <button class="drawer-toggle" id="drawerToggle" type="button" aria-label="Show sidebar" title="Show sidebar"></button>
      <button type="button" data-section="collections" aria-label="Collections" title="Collections"></button>
      <button type="button" data-section="environments" aria-label="Environments" title="Environments"></button>
      <button type="button" data-section="mocks" aria-label="Mocks" title="Mocks"></button>
    </nav>

    <aside class="side" id="side">
      <div class="side-head"><h2 id="sideTitle"></h2><div class="tool-icons" id="sideActions"></div></div>
      <div class="side-content" id="sideContent"></div>
    </aside>

    <main class="main">
      <div class="tabs-open" id="openTabs" role="tablist" aria-label="Open requests"></div>
      <div class="empty-main" id="emptyMain"></div>
      <div class="work" id="work" hidden>
        <section class="req" id="editor" aria-label="Request"></section>
        <section class="resp" id="bottom" aria-label="Response and mock">
          <div class="resp-head">
            <div role="tablist" style="display:flex;gap:16px">
              <button class="subtab" role="tab" type="button" data-pane="response" aria-selected="true">Response</button>
              <button class="subtab" role="tab" type="button" data-pane="mock" aria-selected="false">Mock <span class="mdot" id="mockTabDot" title="Mock on" aria-label="Mock on" hidden></span></button>
            </div>
            <div class="stats" id="stats"></div>
          </div>
          <div class="pane" id="responsePane"></div>
          <div class="pane" id="mockPane" hidden></div>
        </section>
      </div>
    </main>
  </div>
</div>

<input type="file" id="importFile" accept=".txt,.sh,.curl,text/plain" hidden>
<div class="menu" id="menu" role="menu" hidden></div>
<div class="dialog-backdrop" id="dialog" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script type="module" src="panel.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fetchwing mocks</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <span class="mark" id="mark"></span>
    <h1>Fetchwing</h1>
    <span class="count" id="count" aria-live="polite"></span>
    <button type="button" class="btn push" id="pauseAll" disabled></button>
  </header>
  <div class="error top" id="topError" role="alert" hidden></div>
  <div class="banner" id="banner" hidden>
    <span>Mocks are not running on <b id="bannerSite"></b></span>
    <button type="button" class="btn push" id="enableHere">Enable here</button>
  </div>
  <main>
    <ul id="list" aria-label="Mocks"></ul>
    <div class="empty" id="empty" hidden>
      <p class="title">No mocks yet</p>
      <p>Open DevTools → Fetchwing, pick a request and set up its Mock tab.</p>
    </div>
  </main>
  <footer id="footer" hidden></footer>
  <script type="module" src="popup.js"></script>
</body>
</html>
